<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>㈜꿈소 드론교육원 교육신청서</title>
<!--
  ============================================================
   꿈소드론교육원 교육신청서 · 연결 페이지 (apply.html)
  ============================================================
   구글 앱스스크립트 주소를 그대로 열면 맨 위에
   "이 애플리케이션은 Google Apps Script 사용자가 만들었습니다" 안내줄이 뜹니다.
   구글이 넣는 줄이라 코드로는 지울 수 없고, 이 페이지처럼
   다른 주소의 페이지 안에 넣어서 열면 나오지 않습니다.

   올릴 위치 (이미 쓰고 계신 저장소 그대로)
     github.com/ggoomso2019-tech/ggoomso-review  →  apply.html
   올린 뒤 주소
     https://ggoomso2019-tech.github.io/ggoomso-review/apply.html
  ============================================================
-->
<style>
  html, body { margin:0; padding:0; height:100%; background:#f4f6fb; }
  #app { display:block; border:0; width:100%; height:100dvh; min-height:100%; }
  #err { display:none; font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
         padding:40px 20px; text-align:center; color:#4a5568; line-height:1.7; }
  #err a { color:#2563eb; }
</style>
</head>
<body>
<iframe id="app" title="교육신청서" allow="clipboard-write; fullscreen"></iframe>
<div id="err">
  신청서를 불러오지 못했습니다.<br>
  잠시 뒤 다시 시도하시거나 교육원(<a href="tel:1600-7354">☎ 1600-7354</a>)으로 연락해 주세요.
</div>
<script>
  /* 웹 앱 주소 — Apps Script [배포 → 배포 관리]의 웹 앱 URL과 같은지 확인하세요.
     새 버전으로 배포해도 이 주소는 바뀌지 않습니다. */
  var EXEC = 'https://script.google.com/macros/s/AKfycbz_4WwDbHIIZSqhvUxQiS0BrcO5BzhYa68VIT2p7g4Pmy3Mla7YDUqAvRLR9l-0J7Q_/exec';

  var app = document.getElementById('app');
  if (!/^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec$/.test(EXEC)) {
    app.style.display = 'none';
    document.getElementById('err').style.display = 'block';
  } else {
    // ?page=pay&id=… 처럼 주소 뒤에 붙는 내용을 그대로 넘겨 줍니다 (결제 안내·결제 지정 링크)
    app.src = EXEC + (location.search || '');
  }
</script>
</body>
</html>
